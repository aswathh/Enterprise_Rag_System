apiVersion: apps/v1
kind: Deployment
metadata:
  name: enterprise-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: enterprise-app
  template:
    metadata:
      labels:
        app: enterprise-app
    spec:
      containers:
      - name: enterprise-app
        image: enterprise-rag-system
        ports:
        - containerPort: 8052

---
apiVersion: v1
kind: Service
metadata:
  name: enterprise-service
spec:
  selector:
    app: enterprise-app
  ports:
  - port: 8052
    targetPort: 8052
  type: NodePort

